        #intro-screen {

            align-items: center;

        button {

            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
        }

        button:hover { background: #cc0000; }

        #terminal {
            display: none;
            padding: 30px;
            height: 100%;
            box-sizing: border-box;
            flex-direction: column;
        }

        #output {
            flex-grow: 1;
            overflow: hidden;
            white-space: pre-wrap;
            line-height: 1.4;
            font-size: 16px;
            text-shadow: 0 0 5px #33ff66;
        }

        .red { color: #ff2b2b; text-shadow: 0 0 5px #ff2b2b; }
        .amber { color: #ffb000; text-shadow: 0 0 5px #ffb000; }
        
        #clock {

            font-weight: bold;
            color: #ff2b2b;
            text-align: right;
            padding-top: 10px;
            border-top: 1px solid #333;
        }

        .watermark {
            position: absolute;

    <script>

        let timerInterval;

        function startPrank() {
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('terminal').style.display = 'flex';
            document.getElementById('wallpaper').style.display = 'block';

            if (document.documentElement.requestFullscreen) {

                document.body.classList.toggle('flash');

        function runBootSequence() {
            const output = document.getElementById('output');
            let i = 0;
            
            function typeLine() {
                if (i < BOOT_LINES.length) {
                    const line = BOOT_LINES[i];
                    const span = document.createElement('div');
                    span.textContent = line.text;
                    if (line.class) span.className = line.class;
                    output.appendChild(span);
                    output.scrollTop = output.scrollHeight;
                    i++;
                    setTimeout(typeLine, Math.random() * 300 + 100);
                } else {
                    startFileStream();
                }
            }
            typeLine();

        function startFileStream() {
            const output = document.getElementById('output');
            const fileExts = ['docx', 'pdf', 'jpg', 'png', 'txt', 'mp4', 'xlsx'];
            
            let streamInterval = setInterval(() => {

                const name = `C:\\Users\\Public\\Documents\\file_${Math.floor(Math.random()*9999)}.${ext}`;
                
                const span = document.createElement('div');
                span.textContent = `  [LOCKED] ${hash}  ${size}  ${name}`;
                output.appendChild(span);
                output.scrollTop = output.scrollHeight;

                if (output.childNodes.length > 50) {
                    output.removeChild(output.firstChild);
                }
            }, 50);
        }

        function startTimer(duration) {
            const clock = document.getElementById('clock');
            let timer = duration, minutes, seconds;
            
            timerInterval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                clock.textContent = "DESTRUCTION IN  " + minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(timerInterval);
                }
            }, 1000);
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape" || event.key === "F12") {
                exitPrank();
            }
        });

        function exitPrank() {
            clearInterval(timerInterval);
            window.speechSynthesis.cancel();
            
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            }

            document.body.classList.remove('flash');
            document.getElementById('terminal').innerHTML = `
